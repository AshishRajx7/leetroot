version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: leetroot-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leetroot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leetroot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-leetroot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leetroot} -d ${POSTGRES_DB:-leetroot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leetroot-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
